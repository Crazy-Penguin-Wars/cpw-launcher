name: Build CPW App

# Controls when the action will run. 
on:
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    name: Build CPW-App
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-2022]
    env:
      npm_config_openssl_fips: ""

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16.x'
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
        
      - name: Setup MSBuild
        if: startsWith(matrix.os, 'windows')
        uses: microsoft/setup-msbuild@v2

      - name: Install dependencies
        run: yarn

      - name: Install flatpak
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install flatpak -y
          sudo apt-get install flatpak-builder -y
          sudo apt-get install elfutils -y
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install flathub org.freedesktop.Platform/x86_64/22.08 org.freedesktop.Sdk/x86_64/22.08 org.electronjs.Electron2.BaseApp/x86_64/22.08 -y
          git config --global --add protocol.file.allow always

      - name: Make and Publish (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: yarn run publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Make and Publish (WINDOWS)
        if: startsWith(matrix.os, 'windows')
        run: yarn run publish-windows
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Make and Publish (MAC)
        if: startsWith(matrix.os, 'macos')
        run: yarn run publish-mac
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build DMG (MAC)
        if: startsWith(matrix.os, 'macos')
        run: |
          set -e
          APP_PATH="out/Crazy Penguin Wars-darwin-x64/Crazy Penguin Wars.app"
          STAGING_DIR="dmg-staging"
          DMG_PATH="out/make/Crazy Penguin Wars.dmg"

          if [ ! -d "$APP_PATH" ]; then
            echo "Packaged app not found at $APP_PATH"
            exit 1
          fi

          mkdir -p "$STAGING_DIR" out/make
          cp -R "$APP_PATH" "$STAGING_DIR/"
          ln -s /Applications "$STAGING_DIR/Applications"

          hdiutil create -volname "Crazy Penguin Wars" \
            -srcfolder "$STAGING_DIR" \
            -ov -format UDZO \
            "$DMG_PATH"

          if [ ! -f "$DMG_PATH" ]; then
            echo "hdiutil did not produce a DMG"
            exit 1
          fi
          echo "Built DMG: $DMG_PATH"
          echo "DMG_FILE=$DMG_PATH" >> "$GITHUB_ENV"

      - name: Upload DMG to Release (MAC)
        if: startsWith(matrix.os, 'macos')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release upload "v$VERSION" "$DMG_FILE" --clobber